<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Study Planner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Header -->
    <header>
        <h1>Student Study Planner</h1>
        <p>Plan your studies and track your progress.</p>
    </header>

    <!-- Main Content -->
    <main>

        <!-- Progress Section -->
        <section class="progress-section">
            <h2>Study Progress</h2>
            <p id="progressText">Completed: 0%</p>
        </section>

        
        <!-- Task Section -->
<section class="task-section">

    <h2>My Study Tasks</h2>

    <button id="addTaskBtn">+ Add Task</button>

    <!-- Task Form -->
    <div id="taskForm">

        <input 
            type="text" 
            id="subjectInput" 
            placeholder="Enter subject"
        >

        <input 
            type="text" 
            id="taskInput" 
            placeholder="Enter task"
        >

        <button id="saveTaskBtn">Save Task</button>

    </div>

    <!-- Existing Tasks -->
    <div class="task-card">
        <h3>Mathematics</h3>
        <p>Complete Chapter 1</p>
        <input type="checkbox" class="task-checkbox">
    </div>

    <div class="task-card">
        <h3>Programming</h3>
        <p>Practice C++ Basics</p>
        <input type="checkbox" class="task-checkbox">
    </div>

</section>
         

        </section>

    </main>


    <script src="script.js"></script>
</body>
</html>
