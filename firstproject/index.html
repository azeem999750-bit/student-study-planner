<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Study Planner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Header -->
    <header>
        <h1>Student Study Planner</h1>
        <p>Plan your studies and track your progress.</p>
    </header>

    <!-- Main Content -->
    <main>

        <!-- Progress Section -->
        <section class="progress-section">
            <h2>Study Progress</h2>
            <p id="progressText">Completed: 0%</p>
        </section>

        
        <!-- Task Section -->
<section class="task-section">

    <h2>My Study Tasks</h2>

    <button id="addTaskBtn">+ Add Task</button>

    <!-- Task Filters -->
<div class="task-filters">
    <button class="filter-btn active" data-filter="all">
        All Tasks
    </button>

    <button class="filter-btn" data-filter="pending">
        Pending
    </button>

    <button class="filter-btn" data-filter="completed">
        Completed
    </button>

    <button class="filter-btn" data-filter="high">
        High Priority
    </button>
</div>

<!-- Step 14 - Search Tasks -->
<div class="task-search">
    <input
        type="text"
        id="searchInput"
        placeholder="Search by subject or task..."
    >
</div>

    <!-- Task Form -->
    <div id="taskForm">

        <input 
            type="text" 
            id="subjectInput" 
            placeholder="Enter subject"
        >

        <input 
            type="text" 
            id="taskInput" 
            placeholder="Enter task"
        >
        <select id="priorityInput">
    <option value="High">High Priority</option>
    <option value="Medium" selected>Medium Priority</option>
    <option value="Low">Low Priority</option>
</select>
    <input type="date" id="deadlineInput">

        <button id="saveTaskBtn">Save Task</button>

    </div>

    <!-- Existing Tasks -->
    <div class="task-card">
        <h3>Mathematics</h3>
        <p>Complete Chapter 1</p>
        <input type="checkbox" class="task-checkbox">
            <button class="delete-btn">🗑️ Delete</button>

    </div>

    <div class="task-card">
        <h3>Programming</h3>
        <p>Practice C++ Basics</p>
        <input type="checkbox" class="task-checkbox">
            <button class="delete-btn">🗑️ Delete</button>

    </div>

</section>
         

        </section>

    </main>


    <script src="script.js"></script>
</body>
</html>
